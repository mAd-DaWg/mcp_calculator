[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-calculator"
version = "0.1.0"
description = "Infix scientific calculator MCP server for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mcp-calculator = "mcp_calculator.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_calculator"]

[tool.hatch.build.targets.wheel.sources]
"src/mcp_calculator" = "mcp_calculator"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["mcp_calculator"]
omit = ["*/server.py", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
